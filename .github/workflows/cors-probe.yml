name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe5 && cd probe5
          exec > log.txt 2>&1
          set +e
          for O in "https://hugecrankhank.github.io" "https://alttpr.gwaa.kiwi"; do
            echo "######## Origin $O"
            echo "== GET /seed/doesnotexist"; curl -sS -D - -o body1.txt -H "Origin: $O" https://api.alttpr.gwaa.kiwi/seed/doesnotexist | grep -i -E "^HTTP|access-control|content-type|vary"; head -c 200 body1.txt; echo
            echo "== OPTIONS /generate (json POST preflight)"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.alttpr.gwaa.kiwi/generate | grep -i -E "^HTTP|access-control|vary"
            echo "== OPTIONS /seed/x GET"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: GET" https://api.alttpr.gwaa.kiwi/seed/x | grep -i -E "^HTTP|access-control"
          done
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe5; git commit -m "probe: gwaa cors"; git push
