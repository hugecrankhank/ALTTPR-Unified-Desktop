name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: generator
        run: |
          set +e
          OUT=$PWD/probe7
          exec > $OUT/log.txt 2>&1
          git clone --depth 1 https://git.gwaa.kiwi/alttpr-gwaa-kiwi/alttpr-python gw
          git -C gw log -1 --format='%H %ci'
          pip install -q pyyaml fast-enum python-bps-continued aenum colorama aioconsole websockets
          HEAVY="--ow_shuffle full --ow_mixed --ow_crossed polar --shuffle crossed --door_shuffle crossed"
          cd gw
          echo "=== native"
          PYTHONHASHSEED=1 timeout 240 python $OUT/gen.py normal 12345
          PYTHONHASHSEED=2 timeout 240 python $OUT/gen.py normal 12345
          PYTHONHASHSEED=1 timeout 240 python $OUT/gen.py normal 777
          echo "=== pyodide"
          cd $OUT && npm i -s pyodide@0.27.7 >/dev/null 2>&1; du -sh node_modules/pyodide
          ls -la node_modules/pyodide | head -30
          timeout 600 node pyo.mjs $GITHUB_WORKSPACE/gw normal 12345 --next normal 777
          rm -rf node_modules package*.json
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe7; git commit -m "probe: gwaa short result"; git push
