name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          cd probe9
          exec > log.txt 2>&1
          O=https://hugecrankhank.github.io
          echo "== GET seed with Origin $O"; curl -sS -D - -o /dev/null -H "Origin: $O" https://api.alttpr.gwaa.kiwi/seed/hkrKQVVkgT | grep -i -E "^HTTP|access-control|vary"
          echo "== preflight POST /generate"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.alttpr.gwaa.kiwi/generate | grep -i -E "^HTTP|access-control|vary"
          echo "== preflight from another origin"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://example.com" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.alttpr.gwaa.kiwi/generate | grep -i -E "^HTTP|access-control"
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe9; git commit -m "probe: gwaa cors live"; git push
