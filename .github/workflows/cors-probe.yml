name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          mkdir -p probe6
          exec > probe6/log.txt 2>&1
          set +x; set +e
          git clone --depth 1 https://git.gwaa.kiwi/alttpr-gwaa-kiwi/alttpr-python gw
          git -C gw log -1 --format='%H %ci %s'
          tar --exclude=.git -czf probe6/src.tgz gw
          ls -la gw; cat gw/pyproject.toml; cat gw/.python-version
          cd gw
          pip install -q . 2>&1 | tail -5 || true
          pip install -q pyyaml colorama aenum fast-enum websockets 2>&1 | tail -3
          pip freeze
          python DungeonRandomizer.py --help > ../probe6/help.txt 2>&1
          for s in 12345 12345 777; do
            mkdir -p ../out_$s
            /usr/bin/time -v python DungeonRandomizer.py --seed $s --suppress_rom --spoiler full --outputpath ../probe6/out_${s}_$RANDOM 2>&1 | tail -40
          done
          ls -R ../probe6 | head -50
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe6; git commit -m "probe: gwaa generator"; git push
