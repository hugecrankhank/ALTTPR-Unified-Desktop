name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe4 && cd probe4
          exec > log.txt 2>&1
          set +e
          O="Origin: https://hugecrankhank.github.io"
          curl -sS -D headers.txt -o index.html -H "$O" https://alttpr.gwaa.kiwi/generate
          cat headers.txt
          grep -oE '(src|href)="[^"]+"' index.html
          for a in $(grep -oE '(src|href)="/[^"]+\.(js|css)"' index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            f=$(echo $a | tr '/' '_'); curl -sS -o "asset$f" "https://alttpr.gwaa.kiwi$a"; echo "got $a $(wc -c < asset$f)"
          done
          for p in / /api /api/ /robots.txt /about /settings /api/settings /api/randomizer/settings; do
            echo "== $p"; curl -sS -o /dev/null -D - -H "$O" "https://alttpr.gwaa.kiwi$p" | grep -i -E "^HTTP|access-control|content-type|location"
          done
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe4; git commit -m "probe: gwaa"; git push
