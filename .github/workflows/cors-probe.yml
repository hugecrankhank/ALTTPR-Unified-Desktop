name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          cd probe9
          exec > log.txt 2>&1
          curl -sS -o seed-normal.json https://api.alttpr.gwaa.kiwi/seed/hkrKQVVkgT; ls -la seed-normal.json
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe9; git commit -m "probe: gwaa seed json"; git push
