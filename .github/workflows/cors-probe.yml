name: cors-probe
on:
  push:
    branches: [probe-previews]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          cd probe9
          exec > log.txt 2>&1
          echo "=== normal"; python3 api.py get:hkrKQVVkgT
          echo "=== race"; python3 api.py get:ni6WchbWFA
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe9; git commit -m "probe: gwaa api result2"; git push
