name: cors-probe
on:
  push:
    branches: [cors-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe
          exec > log.txt 2>&1
          set +e
          curl -sS https://alttpr.com/sprites -o sprites.json
          for f in 001.link.1 abigail.1 zora.2; do
            curl -sS -o $f.zspr https://alttpr-assets.s3.us-east-2.amazonaws.com/$f.zspr
            curl -sS -o $f.zspr.png https://alttpr-assets.s3.us-east-2.amazonaws.com/$f.zspr.png
          done
          ls -la
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A probe; git commit -m "probe files"; git push
